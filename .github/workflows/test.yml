name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calc:
    name: 计算核心断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 运行测试（零依赖）
        run: node tests/calc.test.js
