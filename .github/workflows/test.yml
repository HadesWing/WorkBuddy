name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 计算断言 + 结构冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 计算核心断言（零依赖）
        run: node tests/calc.test.js
      - name: 结构完整性冒烟测试
        run: node tests/structure.test.js
      - name: 主流程冒烟（逐模块执行渲染函数）
        run: node tests/smoke.test.js
      - name: 构建 PWA 版本（校验图标与清单齐全）
        run: |
          python tools/make_icons.py
          node tools/build-app.js
          test -f app/index.html
